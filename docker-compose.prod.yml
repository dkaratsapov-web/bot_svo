# Production-стек для сервера (рег.облако / любой Ubuntu-VPS).
# Образ бота тянется из GHCR; обновления накатывает Watchtower автоматически.
#
# Запуск на сервере:
#   docker compose -f docker-compose.prod.yml up -d
#
# Требуется заполненный .env (см. .env.example), в т.ч. IMAGE, DOMAIN, ACME_EMAIL,
# MODE=webhook, WEBHOOK_URL=https://$DOMAIN/max/webhook.
#
# Конфигурация рассчитана на скромный сервер (1 vCPU / 1 ГБ / 10 ГБ):
# ограничена память Redis, включена ротация логов, заданы лимиты памяти.
# На 1 ГБ обязательно настройте swap — см. DEPLOY.md, шаг 3.

# Ротация логов: без неё JSON-логи structlog со временем забьют диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    labels:
      # Watchtower обновляет только контейнеры с этой меткой.
      com.centurylinklabs.watchtower.enable: "true"
    # Порт наружу не публикуем — доступ только через Caddy.
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8080/healthz", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory + volatile-lru: под вытеснение попадают только ключи с TTL
    # (идемпотентность), FSM-состояния незавершённых анкет сохраняются.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Профиль webhook: Caddy нужен только когда есть домен и MODE=webhook.
    # Без домена стек поднимается в polling-режиме без этого сервиса:
    #   docker compose -f docker-compose.prod.yml up -d
    # С доменом (webhook):
    #   docker compose -f docker-compose.prod.yml --profile webhook up -d
    profiles: ["webhook"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
    mem_limit: 128m
    logging: *default-logging

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Для приватного образа GHCR смонтируйте docker config с токеном:
      # - ~/.docker/config.json:/config.json:ro
    command: >
      --label-enable
      --cleanup
      --interval 300
    environment:
      WATCHTOWER_NOTIFICATIONS_LEVEL: info
    mem_limit: 96m
    logging: *default-logging

  backup:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do /app/scripts/backup.sh; sleep 86400; done"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    mem_limit: 64m
    logging: *default-logging

volumes:
  redis-data:
  caddy-data:
  caddy-config:
