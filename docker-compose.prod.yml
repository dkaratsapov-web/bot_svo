# Production-стек для сервера (Yandex Cloud VM / любой Ubuntu-VPS).
# Образ бота тянется из GHCR; обновления накатывает Watchtower автоматически.
#
# Запуск на сервере:
#   docker compose -f docker-compose.prod.yml up -d
#
# Требуется заполненный .env (см. .env.example), в т.ч. IMAGE, DOMAIN, ACME_EMAIL,
# MODE=webhook, WEBHOOK_URL=https://$DOMAIN/max/webhook.

services:
  bot:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    labels:
      # Watchtower обновляет только контейнеры с этой меткой.
      com.centurylinklabs.watchtower.enable: "true"
    # Порт наружу не публикуем — доступ только через Caddy.
    expose:
      - "8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Для приватного образа GHCR смонтируйте docker config с токеном:
      # - ~/.docker/config.json:/config.json:ro
    command: >
      --label-enable
      --cleanup
      --interval 120
    environment:
      WATCHTOWER_NOTIFICATIONS_LEVEL: info

  backup:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do /app/scripts/backup.sh; sleep 86400; done"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

volumes:
  redis-data:
  caddy-data:
  caddy-config:
