# Production-стек для сервера (рег.облако / любой Ubuntu-VPS).
# Образ бота тянется из GHCR; обновления накатывает systemd-таймер
# (scripts/selfupdate.sh) — он же подтягивает изменения инфраструктуры.
#
# Режим polling (домен не нужен) — этот файл самодостаточен:
#   docker compose -f docker-compose.prod.yml up -d
#
# Режим webhook (нужен домен) — добавьте overlay с Caddy и TLS:
#   docker compose -f docker-compose.prod.yml -f docker-compose.webhook.yml up -d
#
# Caddy намеренно вынесен в отдельный файл, а не в compose-профиль: поведение
# профилей различается между версиями Compose, и Caddy без DOMAIN уходил
# в бесконечный рестарт.
#
# Конфигурация рассчитана на скромный сервер (1 vCPU / 1 ГБ / 10 ГБ):
# ограничена память Redis, включена ротация логов, заданы лимиты памяти.
# На 1 ГБ обязательно настройте swap (это делает scripts/install-server.sh).

# Ротация логов: без неё JSON-логи structlog со временем забьют диск.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    # Порт наружу не публикуем: в polling он не нужен, в webhook доступ
    # идёт через Caddy из docker-compose.webhook.yml.
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8080/healthz", timeout=5).status == 200 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory + volatile-lru: под вытеснение попадают только ключи с TTL
    # (идемпотентность), FSM-состояния незавершённых анкет сохраняются.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    logging: *default-logging

  backup:
    image: ${IMAGE:-ghcr.io/dkaratsapov-web/bot_svo:latest}
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do /app/scripts/backup.sh; sleep 86400; done"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    mem_limit: 64m
    logging: *default-logging

volumes:
  redis-data:
